# workflow/profiles/slurm/config.yaml

executor: slurm
jobs: 10
latency-wait: 60
keep-going: true
printshellcmds: true

# Default resources for ALL jobs unless overridden in the Snakefile
# NOTE: Replace 'my_lab_account' with your actual Slurm account.
# Try these commands on VACC to find yours:
# 1. sacctmgr show user $USER format=Account%30
# 2. sshare -U $USER (Look for the 'Account' column)
# 3. id -gn (Your primary group is often your account)
default-resources:
  slurm_account: "pi-cdanfort"
  slurm_partition: "bluemoon"
  runtime: "4h"
  mem_mb: 4000

# Map Slurm-specific flags for the plugin
set-resources:
  train_bert_classifier:
    slurm_partition: "nvgpu"
    gpu: 1
    mem_mb: 16000
    runtime: "12h"
