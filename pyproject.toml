[project]
name = "scientific_dev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.76.0",
    "ipykernel>=7.1.0",
    "jax>=0.9.0",
    "jaxlib>=0.9.0",
    "jupyterlab>=4.5.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "openai>=2.15.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.2.1",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "snakemake>=8.4.0",
    "snakemake-executor-plugin-slurm>=0.11.0",
    "duckdb>=1.1.3",
    "pyarrow>=19.0.0",
    "fastparquet>=2024.11.0",
    "optax>=0.2.3",
    "flax>=0.10.2",
    "tqdm>=4.67.1",
    "wandb>=0.19.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scientific_dev"]
