name: "higgs_baseline"
model:
  hidden_dims: [256, 128, 64]
  activation: "relu"
training:
  learning_rate: 0.001
  batch_size: 1024
  epochs: 5
  seed: 42
data:
  parquet_path: "data/higgs.parquet"
  use_high_level_features: true
wandb:
  enabled: true
  project: "higgs-classification"
  entity: "YOUR_WANDB_USERNAME" # Update this with your WandB username
