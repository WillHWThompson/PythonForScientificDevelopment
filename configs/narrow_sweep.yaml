name: "narrow_sweep"
model:
  hidden_dims: [128, 64]
  activation: "relu"
training:
  learning_rate: 0.001
  batch_size: 1024
  epochs: 3
  seed: 42
data:
  parquet_path: "data/higgs.parquet"
  use_high_level_features: true
wandb:
  enabled: true
  project: "higgs-classification"
  entity: "wthomps3@uvm.edu"

# Parameters to sweep over for THIS config
sweep:
  hidden_dims:
    - [64,32]
    - [32,16]
  learning_rate: [0.001]
