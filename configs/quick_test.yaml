name: "quick_test_run"
model:
  model_name: "distilbert-base-uncased"
  adapter_dim: 128
  num_classes: 4
  dropout: 0.1
training:
  learning_rate: 0.0001
  batch_size: 16
  epochs: 1
  max_length: 64
data:
  dataset_name: "ag_news"
  train_split: "train"
  val_split: "test"
  max_samples: 100
wandb_enabled: false
