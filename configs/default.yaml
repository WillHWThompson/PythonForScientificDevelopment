name: "higgs_baseline"
model:
  hidden_dims: [256, 128, 64]
  activation: "relu"
training:
  learning_rate: 0.001
  batch_size: 1024
  epochs: 5
  seed: 42
data:
  parquet_path: "data/higgs.parquet"
  use_high_level_features: true
wandb:
  enabled: true
  project: "higgs-classification"
  entity: "wthomps3@uvm.edu"

# Parameters to sweep over
sweep:
  hidden_dims:
    - [128, 64]
    - [256, 128, 64]
    - [512, 256, 128, 64]
  learning_rate: [0.001, 0.0005]
